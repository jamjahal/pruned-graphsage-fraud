# DGraphFin SynFlow Pruning Configuration
# This config trains a GraphSAGE model with SynFlow-based weight pruning
# SynFlow prunes based on gradient flow, preserving important connectivity patterns

# Data and output settings
data_root: "data/DGraphFin2"                      # Path to processed DGraphFin2 dataset
output_dir: "experiments/results/pruned_synflow"  # Directory to save training results

# Model architecture settings
model_variant: "pruned_synflow"                   # Model type: SynFlow pruning (preserves gradient flow)
sampling: "heuristic"                             # Biased sampling toward fraud nodes (better for imbalanced data)
sparsity: 0.9                                     # Target sparsity level (0.9 = 90% weights removed, keep 10%)

# Training hyperparameters (may need tuning for SynFlow)
train:
  epochs: 20                                      # Number of training epochs (may need adjustment for pruned models)
  lr: 0.001                                       # Learning rate (may need tuning after pruning)
  weight_decay: 0.00005                           # L2 regularization (helps with pruning)
  hidden_channels: 128                            # Hidden dimension (same as other configs)
  num_layers: 2                                   # GraphSAGE layers (same as other configs)
  dropout: 0.2                                    # Dropout rate (same as other configs)

  # Data loading settings - heuristic sampling recommended for imbalanced fraud detection
  batch_size: 2048                                # Training batch size (same as other configs)
  num_neighbors: [25, 25]                         # Neighbors per layer (same as other configs)
  num_hops: 2                                     # Hops for heuristic sampling (same as other configs)

  # Negative sampling ratios for heuristic sampling
  k_pos: 25                                       # Fraud neighbors to sample (positive class)
  k_neg: 5                                        # Normal neighbors to sample (negative class, lower ratio for imbalance)

  # Device settings - adjust based on your hardware:
  # - "cuda" for NVIDIA GPUs (use in Colab or desktop environments with CUDA)
  # - "cpu" for CPU-only or Apple Silicon (DGL currently lacks MPS support)
  # Note: SynFlow pruning requires gradient computation and may be more GPU-intensive initially.
  device: "cpu"

# Random seeds for reproducible results (important for comparing pruning methods)
seeds: [1, 2, 3, 4, 5]


